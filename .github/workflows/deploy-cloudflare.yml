# Deploy the hosted Worker to https://terminal.kohor.st on merge to main
# (and to the current integration branch, where PRs land).
#
# Required GitHub Actions secrets on Lucas-Kohorst/gloomberb:
#   CLOUDFLARE_API_TOKEN   — API token with Workers Scripts Edit (and Workers Routes Edit)
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account id (Lucas Kohorst: 260fd5d79ea3c6aeb571e79b106335ae)
#
# Existing Worker secrets (ADJACENT_API_KEY, etc.) are kept by `wrangler deploy`;
# this workflow does not put or overwrite them.
name: Deploy Cloudflare

on:
  push:
    branches:
      - main
      - integration/v0.12.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Deploy hosted Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set. Add it as a GitHub Actions secret on Lucas-Kohorst/gloomberb."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is not set. Add it as a GitHub Actions secret (260fd5d79ea3c6aeb571e79b106335ae)."
            exit 1
          fi
          bun run cloud:deploy
